<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="osg.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-steamgate demo: Travels</title>
  <style>
    /* a Fiori Elements app fills the page; without this html/body collapse to
       0 height and the NavContainer (overflow hidden) clips everything */
    html, body { height: 100%; margin: 0; }
  </style>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.50/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.ui.generic.app,sap.suite.ui.generic.template"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-xx-componentPreload="off"
    data-sap-ui-flexibilityServices=""
    data-sap-ui-resourceroots='{"stg.travel": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"></script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="stg.travel" data-id="container" data-height="100%" data-settings='{"id": "stg.travel"}' style="height: 100%"></div>
</body>
</html>
