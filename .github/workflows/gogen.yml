name: gogen

# The Go backend of the ABAP runtime (tools/gogen, docs in its README): the
# generator's Go runtime and its tests, and the semantics harness that runs
# the same ABAP as Go and as IR-as-JS against A4H-measured answers.
#
# A job of its own, path-filtered, so a change to it never slows or reds the
# main tests workflow, and a change elsewhere does not start a Go toolchain.
#
# `go test ./abap/...` and not `go build ./...`: cmd/bench, cmd/osgo and
# cmd/osabap compile only after their runner has generated their half, so a
# plain build of the module fails by design. The pairs in test/fixtures/ir-pairs are shared with
# the Node IR, so a change there runs this too: a pair main adds that the Go
# runtime does not do yet goes into the strict known-gap list
# (knowngaps_test.go, empty today), which turns red if one starts to pass.
#
# The OSGo host's gate is the osgo-host job of tests.yml: it depends on all
# of src/ and the packs, so it runs on every change, from the build job's
# tree. osgo-parity here runs OSG's own suites against Node and the binary
# and is heavy, so it runs only when asked for (workflow_dispatch, parity).

on:
  pull_request:
    paths:
      - 'tools/gogen/**'
      - 'tsconfig.gogen.json'
      - 'tools/osd-samc.mjs'
      - 'test/osd-no-ts-runtime.mjs'
      - 'test/fixtures/ir-pairs/**'
      - 'src/demo_data/**'
      - 'libs.lock.json'
      - 'src/**'
      - 'test/unit/**'
      - 'test/gogen-typing-proof.mjs'
      - 'test/osgo-unit.mjs'
      - 'test/osgjs-unit.mjs'
      - 'test/fixtures/osgjs-unit-m1/**'
      - 'tools/osgjs-unit*.mjs'
      - 'tools/osd-unit-ci.mjs'
      - 'tools/osgo-unit.mjs'
      - 'tools/osd-host.mjs'
      - 'bin/osd.mjs'
      - 'test/suites.d/gogen-osgo.json'
      - 'packs/**'
      - 'abap_transpile.json'
      - '.github/workflows/gogen.yml'
  push:
    branches: [main]
    paths:
      - 'tools/gogen/**'
      - 'tsconfig.gogen.json'
      - 'tools/osd-samc.mjs'
      - 'test/osd-no-ts-runtime.mjs'
      - 'test/fixtures/ir-pairs/**'
      - 'src/demo_data/**'
      - 'libs.lock.json'
      - 'src/**'
      - 'test/unit/**'
      - 'test/gogen-typing-proof.mjs'
      - 'test/osgo-unit.mjs'
      - 'test/osgjs-unit.mjs'
      - 'test/fixtures/osgjs-unit-m1/**'
      - 'tools/osgjs-unit*.mjs'
      - 'tools/osd-unit-ci.mjs'
      - 'tools/osgo-unit.mjs'
      - 'tools/osd-host.mjs'
      - 'bin/osd.mjs'
      - 'test/suites.d/gogen-osgo.json'
      - 'packs/**'
      - 'abap_transpile.json'
      - '.github/workflows/gogen.yml'
  workflow_dispatch:
    inputs:
      parity:
        description: Also run OSG's suites against OSGo (parity.mjs --fast; heavy)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: gogen-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gogen:
    runs-on: ubuntu-latest
    # 20 minutes cut the job mid-suite on main (2026-10-11, 10-13) and on
    # #721 twice: a cancelled run is not a green one, so give it room
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc -p tsconfig.gogen.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      # the semantics harness compiles the ABAP it runs together with
      # open-abap-core, read from .local/lars like every other build
      - name: The library folders
        run: |
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check
      - name: Go vet and tests
        working-directory: tools/gogen/go
        run: |
          go vet ./profiling/ ./abap/ ./termgui/ ./filepick/ ./amc/ ./session/... ./enq/ ./sandbox/ ./objstore/ ./osdbind/
          go test ./profiling/ ./xbuf/... ./bytesection/... ./abap/... ./intpower/... ./termgui/... ./filepick/... ./session/... ./sandbox/... ./objstore/... ./osdbind/...
          # the sandbox builds for the browser too (nofollow_other.go)
          GOOS=js GOARCH=wasm go build ./sandbox/ ./objstore/
          # ABAP's process-global string memos, the AMC broker and the lock
          # server are concurrent: test them with the race detector (enq: E0).
          go test -race ./abap/... ./amc/... ./enq/...
      - name: Semantics, Go and IR-as-JS against the measured answers
        run: node tools/gogen/semantics.mjs
      - name: Byte ownership and frontend emission
        run: node --test tools/gogen/frontend-token-parsers.test.mjs tools/gogen/emit-large.test.mjs tools/gogen/frontend-owned.test.mjs tools/gogen/frontend-ddic.test.mjs tools/gogen/frontend-bytes.test.mjs tools/gogen/emit-go.test.mjs tools/gogen/emit-sink-locals.test.mjs tools/gogen/symbols.test.mjs tools/gogen/local-constants.test.mjs tools/gogen/cfit.test.mjs tools/gogen/session-statics.test.mjs tools/gogen/frontend-supplied.test.mjs tools/gogen/sink-locals.test.mjs tools/gogen/ir-children.test.mjs tools/gogen/ir-children-completeness.test.mjs
      # frontend-artifact-digests.test.mjs compares Node and Bun digests
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Frontend cache validation and replay
        # One file at a time: the cache's tool identity hashes tools/**, so a
        # file writing there while another compiles changes that identity
        # mid-test (provenance, digest and query suites were never run here).
        env:
          GOGEN_CACHE_SHADOW_VALIDATE: "1"
        run: node --test --test-concurrency=1 tools/gogen/frontend-cache.test.mjs tools/gogen/runner-cache.test.mjs tools/gogen/frontend-object-cache.test.mjs tools/gogen/frontend-replay.test.mjs tools/gogen/frontend-portable.test.mjs tools/gogen/frontend-provenance.test.mjs tools/gogen/frontend-provenance-regression.test.mjs tools/gogen/frontend-provenance-compare.test.mjs tools/gogen/frontend-artifact-digests.test.mjs tools/gogen/frontend-queries.test.mjs tools/gogen/frontend-v3-shadow.test.mjs tools/gogen/frontend-certificates.test.mjs tools/gogen/frontend-v3-sensitivity.test.mjs tools/gogen/frontend-v3-audit.test.mjs tools/gogen/cache-oracle.test.mjs
      - name: Go byte fixtures and ABAPiti repros
        run: node tools/gogen/unit.mjs --fixture tools/gogen/testdata --jobs 4
      # osabap: a report built into a native command (open-abap-gui's
      # converter, from the pinned clone osd-libs made), run with flags,
      # ranges, no arguments and the native frontend
      - name: osabap, a report as a native command
        # the library clones must be the pinned ones (tools/gogen/lib-pins.mjs)
        env:
          OSABAP_STRICT_PINS: "1"
        run: node --test tools/gogen/builtins.test.mjs tools/gogen/lib-pins.test.mjs tools/gogen/osabap-f4.test.mjs tools/gogen/osabap-list.test.mjs tools/gogen/osabap.test.mjs tools/gogen/osabap-sql-corpus.test.mjs tools/gogen/unit.test.mjs
      # Node only: reuse the pinned libraries without rebuilding a native
      # binary for every list fixture; keep the 35-minute job budget.
      - name: List positioning, direct and converted Node
        run: node tools/gogen/list-position-oracle.mjs --check
      - name: Generated-class ABAP Unit CI entry points (real Go and JS builds)
        run: flock /tmp/osd-heavy.lock node tools/osd-suites.mjs --group gogen

  unit-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - name: Fetch source packs and libraries
        run: |
          node tools/osd-libs.mjs
          node tools/osd-fetch.mjs
      - name: Build the Node oracle inputs
        run: npm run transpile
      # The inventory is expected to report gaps (exit 1: failed methods,
      # exit 2: not compiled) until Go parity is complete, so those are
      # written to the summary and do not turn the check red. A crash (any
      # other exit, or no parsable JSON) does.
      - name: Full Go ABAP Unit inventory
        run: |
          set +e
          node tools/gogen/unit.mjs --jobs "$(node -p 'Math.min(require("os").availableParallelism(), 16)')" --out "$RUNNER_TEMP/gogen-unit" > "$RUNNER_TEMP/gogen-unit.json"
          rc=$?
          set -e
          if [[ $rc -gt 2 ]]; then echo "unit.mjs crashed with exit $rc" >&2; exit "$rc"; fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const n = {};
            for (const row of r.rows) n[row.status] = (n[row.status] ?? 0) + 1;
            console.log(`gogen ABAP Unit inventory (exit ${process.argv[2]}): ${Object.entries(n).map(([k, v]) => `${k} ${v}`).join(", ")}`);
          ' "$RUNNER_TEMP/gogen-unit.json" "$rc" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GOCACHE: ${{ runner.temp }}/gogen-unit-go-cache
      # X1b: the sXML XML reader compiled to Go, over the core layer the
      # inventory just generated. sxmlbench checks the token and attribute
      # counts itself and panics on a mismatch; the speed goes to the summary
      # (10 MiB, 2026-09-30, one machine: Node 0.42 MiB/s, Go 11.2 MiB/s).
      - name: sXML reader on Go (X1b)
        run: |
          cd "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).buildDir' "$RUNNER_TEMP/gogen-unit.json")"
          go build -o "$RUNNER_TEMP/sxmlbench" ./cmd/sxmlbench
          "$RUNNER_TEMP/sxmlbench" 10 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GOCACHE: ${{ runner.temp }}/gogen-unit-go-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gogen-unit-results
          path: ${{ runner.temp }}/gogen-unit.json
          if-no-files-found: ignore

  osgo-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      # the transpiler this tree is pinned to, as tests.yml builds it (same
      # cache key): the published one wrote wrong W3MI keys, and the Node
      # reference must be measured on the transpiler OSG runs on
      - name: Where the pinned transpiler lives
        run: echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - name: Restore the pinned transpiler build
        id: transpiler_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('libs.lock.json') }}-${{ hashFiles('tools/osd-ci-transpiler-build.sh') }}
      - name: Build the transpiler this tree is pinned to
        if: steps.transpiler_cache.outputs.cache-hit != 'true'
        run: bash tools/osd-ci-transpiler-build.sh build
      - name: Verify and link the pinned transpiler
        run: |
          bash tools/osd-ci-transpiler-build.sh verify
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-transpiler.mjs
      - name: The library folders and the packs
        run: |
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check
          node tools/osd-fetch.mjs
      - name: A generation of this tree
        run: npm run transpile
      - name: OSGo built
        run: node tools/gogen/osgo.mjs
      - name: OSG's suites against Node and OSGo
        run: node tools/gogen/parity.mjs --fast --out "$RUNNER_TEMP/parity"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity
          path: ${{ runner.temp }}/parity
