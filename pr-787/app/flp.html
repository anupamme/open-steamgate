<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="osg.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-steamgate demo: launchpad</title>
  <style>
    html, body { height: 100%; margin: 0; }
    /* Keep the custom mark inside UI5's existing 60 × 30 header slot. */
    #shell-header-icon { width: 60px; height: 30px; object-fit: cover; }
  </style>
  <script>
    // The Fiori launchpad sandbox: two apps over the same transpiled service,
    // Travels (stg.travel) and Bookings (stg.booking), reachable by intent so
    // that cross-app navigation (UI.DataFieldForIntentBasedNavigation,
    // UI.DataFieldWithIntentBasedNavigation) has somewhere to go. Nothing
    // here is specific to open-steamgate: it is the sandbox any Fiori
    // developer runs locally.
    // The tiles: launchpad.js sets them again after the sandbox has mixed in
    // its own file (which replaces "groups" and adds every application of the
    // sandbox as a tile), so only these stay.
    window["stg-launchpad-groups"] = [
                {
                  id: "demo",
                  title: "open-steamgate",
                  isPreset: true,
                  isVisible: true,
                  isGroupLocked: false,
                  tiles: [
                    {
                      id: "travels",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Travels",
                        subtitle: "list report, object page",
                        info: "ZSTG_DEMO_SRV",
                        icon: "sap-icon://travel-itinerary",
                        targetURL: "#Travel-manage"
                      }
                    },
                    {
                      id: "bookings",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Bookings",
                        subtitle: "list report",
                        info: "ZSTG_DEMO_SRV",
                        icon: "sap-icon://flight",
                        targetURL: "#Booking-display"
                      }
                    },
                    {
                      id: "analytics",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Flight analytics",
                        subtitle: "analytical list page",
                        info: "ZSTG_SADL_SRV",
                        icon: "sap-icon://bar-chart",
                        targetURL: "#Flight-analyze"
                      }
                    },
                    {
                      id: "taxi-analytics",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "NYC taxi analytics",
                        subtitle: "NYC TLC trip analytics",
                        info: "ZSTG_SADL_SRV",
                        icon: "sap-icon://bar-chart",
                        targetURL: "#Taxi-analyze"
                      }
                    },
                    {
                      id: "segw",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "SEGW",
                        subtitle: "Service Builder",
                        info: "ZSTG_SEGW_SRV",
                        icon: "sap-icon://tree",
                        targetURL: "#SegwProject-manage"
                      }
                    },
                    {
                      id: "icf",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "ICF services",
                        subtitle: "the service tree, and who last changed it",
                        info: "ZOSD_ICF_SRV",
                        icon: "sap-icon://tree",
                        targetURL: "#IcfNode-manage"
                      }
                    },
                    {
                      id: "status",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "System status",
                        subtitle: "what runs, on which ports",
                        info: "ZOSD_STATUS_SRV",
                        icon: "sap-icon://monitor",
                        targetURL: "#System-status"
                      }
                    },
                    {
                      id: "workbench",
                      stgRequires: "ADT",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Workbench",
                        subtitle: "edit, check and activate ABAP",
                        info: "ADT",
                        icon: "sap-icon://syntax",
                        targetURL: "#Workbench-edit"
                      }
                    },
                    {
                      id: "vividvibes",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Vivid Vibes",
                        subtitle: "a demo, in ABAP",
                        info: "ZCL_O4D_HTTP_HANDLER",
                        icon: "sap-icon://video",
                        targetURL: "#VividVibes-play"
                      }
                    },
                    {
                      id: "zork",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Zork I (MIT source release)",
                        subtitle: "a Z-machine, in ABAP",
                        info: "ZCL_APC_ZORK",
                        icon: "sap-icon://keyboard-and-mouse",
                        targetURL: "#Zork-play"
                      }
                    },
                    {
                      id: "lsd",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "LSD",
                        subtitle: "a light-show, as SAP GUI screens",
                        info: "ZCL_LSD_APC_HANDLER",
                        icon: "sap-icon://sys-monitor",
                        targetURL: "#Lsd-play"
                      }
                    },
                    {
                      id: "webgui",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "WEBGUI",
                        subtitle: "Easy Success, the menu of this system",
                        info: "ZCL_OSD_WEBGUI",
                        icon: "sap-icon://tree",
                        targetURL: "#EasyAccess-show"
                      }
                    },
                    {
                      id: "sysinfo",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "System information",
                        subtitle: "who this system is, what runs it",
                        info: "ZCL_OSD_SYSINFO",
                        icon: "sap-icon://it-host",
                        targetURL: "#SystemInfo-show"
                      }
                    },
                    {
                      id: "se16",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Data browser",
                        subtitle: "a table and its rows",
                        info: "82 entities",
                        icon: "sap-icon://table-view",
                        targetURL: "#DataBrowser-show"
                      }
                    },
                    {
                      // greyed by launchpad.js when nothing behind the
                      // destination can run SQLScript: a tile that looks
                      // alive and does nothing is worse than a grey one
                      id: "amdp",
                      stgRequires: "HDB",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "AMDP sandbox",
                        subtitle: "SQLScript, typed and run",
                        info: "needs HDB",
                        icon: "sap-icon://database",
                        targetURL: "#Amdp-play"
                      }
                    },
                    {
                      id: "source",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Source",
                        subtitle: "oisee/open-steamgate",
                        info: "GitHub",
                        icon: "sap-icon://source-code",
                        targetURL: "#Source-open"
                      }
                    },
                    {
                      // the same link as a picture, for a phone pointed at a
                      // screen: its own tile, because a static tile's icon
                      // box is too small for a code to be read from
                      id: "source-qr",
                      tileType: "sap.ushell.ui.tile.ImageTile",
                      properties: {
                        imageSource: "./qr-github.png",
                        targetURL: "#Source-open"
                      }
                    }
                  ]
                }
              ];
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      renderers: {
        fiori2: {
          componentData: {
            config: {
              enableSearch: false,
              enablePersonalization: false,
              rootIntent: "Shell-home",
              // UI5's sandbox does not apply shellLogo in this version;
              // launchpad.js also updates the rendered header image.
              appState: "lean",
              shellLogo: "osd-airship.svg",
              rootIntentDisplayName: "open-steamgate"
            }
          }
        }
      },
      // **The component URLs are relative to this page, and an absolute one
      // broke every tile on GitHub Pages.**
      //
      // `fc03de9` repointed these at the BSP paths, which is right -- the
      // apps come out of the object store now. But `/sap/bc/ui5_ui5/...`
      // is absolute from the ORIGIN root, and on Pages this system lives
      // under /open-steamgate/main/, so the loader asked
      // oisee.github.io/sap/bc/... and got a 404: "App could not be opened
      // because the SAP UI5 component of the application could not be
      // loaded", on every tile.
      //
      // The same trap is already written down one layer below, in
      // tools/osd-bsp-registry.mjs, about the manifest's data source: "in
      // the GitHub Pages preview the origin's root is not this system's
      // root, which is why it was relative in the first place". I wrote
      // that comment and then made the same mistake above it.
      //
      // `../sap/bc/...` from /app/flp.html is /sap/bc/... on a system and
      // /open-steamgate/main/sap/bc/... on Pages, which is the one spelling
      // that is right in both.
      applications: {
        "Travel-manage": {
          title: "Travels",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.travel",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_travel_app/",
          navigationMode: "embedded"
        },
        "Booking-display": {
          title: "Bookings",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.booking",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_booking_ap/",
          navigationMode: "embedded"
        },
        "Flight-analyze": {
          title: "Flight analytics",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.analytics",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_analytics/",
          navigationMode: "embedded"
        },
        "Taxi-analyze": {
          title: "NYC taxi analytics",
          description: "real TLC trip records",
          additionalInformation: "SAPUI5.Component=stg.taxi",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_taxi_anal/",
          navigationMode: "embedded"
        },
        "SegwProject-manage": {
          title: "SEGW",
          description: "the Service Builder as an app",
          additionalInformation: "SAPUI5.Component=stg.segw",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_segw_app/",
          navigationMode: "embedded"
        },
        "IcfNode-manage": {
          title: "ICF services",
          description: "what answers which path, and who last said so",
          additionalInformation: "SAPUI5.Component=stg.icf",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_icf_app/",
          navigationMode: "embedded"
        },
        "System-status": {
          title: "System status",
          description: "what runs, on which ports, out of which packs",
          additionalInformation: "SAPUI5.Component=stg.status",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosd_status_app/",
          navigationMode: "embedded"
        },
        "Workbench-edit": {
          title: "Workbench",
          description: "edit, check and activate ABAP sources",
          additionalInformation: "SAPUI5.Component=stg.workbench",
          applicationType: "URL",
          url: "../sap/bc/ui5_ui5/sap/zosg_workbench/",
          navigationMode: "embedded"
        },
        // Two that are not UI5 at all.
        //
        // The four above are components the launchpad loads. These two are
        // pages an ABAP class writes, served from the ICF path by the same
        // runtime — on Node behind the express shim, in the preview by the
        // service worker. No additionalInformation, so the sandbox treats
        // them as plain URLs and frames them, which is the honest shape: the
        // tile is a launchpad's way of pointing at a service, and what is
        // behind it does not have to be UI5 to belong on the page.
        "VividVibes-play": {
          title: "Vivid Vibes",
          description: "WebGL and audio, driven from ABAP over a push channel",
          applicationType: "URL",
          url: "../sap/bc/zo4d_demo",
          navigationMode: "embedded"
        },
        "Zork-play": {
          title: "Zork I (MIT source release)",
          description: "a Z-machine interpreter in ABAP, the story file out of SMW0",
          applicationType: "URL",
          url: "../sap/bc/zork",
          navigationMode: "embedded"
        },
        "EasyAccess-show": {
          title: "WEBGUI",
          description: "Easy Success: the classic entry screen, drawn by an ABAP class from the system's own status tables",
          applicationType: "URL",
          url: "../sap/bc/gui/sap/its/webgui/",
          navigationMode: "embedded"
        },
        "Lsd-play": {
          title: "LSD",
          description: "the sap-lsd light-show, recorded as SAP GUI screens and replayed over a push channel",
          applicationType: "URL",
          url: "../sap/bc/lsd",
          navigationMode: "embedded"
        },
        "SystemInfo-show": {
          title: "System information",
          description: "the system as sy shows it, and the environment that runs the ABAP",
          applicationType: "URL",
          url: "../sap/bc/osd/sysinfo/",
          navigationMode: "embedded"
        },
        "DataBrowser-show": {
          title: "Data browser",
          description: "pick a table, see its rows -- read through the application, not around it",
          applicationType: "URL",
          url: "../sap/bc/osd/se16/",
          navigationMode: "embedded"
        },
        "Amdp-play": {
          title: "AMDP sandbox",
          description: "a SQLScript body, deployed, run and dropped again",
          applicationType: "URL",
          url: "../sap/bc/osd/amdp/",
          navigationMode: "embedded"
        },
        "Source-open": {
          title: "Source",
          description: "the repository this launchpad is built from",
          applicationType: "URL",
          url: "https://github.com/oisee/open-steamgate",
          navigationMode: "newWindow"
        }
      },
      services: {
        LaunchPage: {
          adapter: {
            config: {
              groups: window["stg-launchpad-groups"]
            }
          }
        },
        NavTargetResolution: {
          config: {
            enableClientSideTargetResolution: true
          }
        }
      }
    };

    // **A pack's own intents join the applications before the sandbox boots.**
    //
    // The sandbox resolves an intent only from the applications it was booted
    // with; one added afterwards (launchpad.js adds the packs' tiles then)
    // answered "could not be opened" (2026-09-17). So the intents a pack's
    // manifest declares (crossNavigation.inbounds, served in ./packs.json by
    // tools/osd-bsp-registry.mjs packApplications) are read here, before
    // sandbox.js, synchronously on purpose: the boot must not start without
    // them. A built-in application keeps its intent and its component: a pack
    // declaring either again is skipped, since two apps under one component
    // name would load whichever the loader found first. For the same reason
    // one component is one app: every inbound of a pack app goes in, and a
    // second pack naming that component at another URL does not. No server
    // (a static preview without packs.json) leaves the list as it is.
    (function () {
      var applications = window["sap-ushell-config"].applications;
      var builtIn = {};
      Object.keys(applications).forEach(function (intent) {
        builtIn[applications[intent].additionalInformation] = true;
      });
      var fromPack = {};
      try {
        var request = new XMLHttpRequest();
        request.open("GET", "./packs.json", false);
        request.send();
        var fromPacks = request.status === 200 ? (JSON.parse(request.responseText).applications || {}) : {};
        Object.keys(fromPacks).forEach(function (intent) {
          var app = fromPacks[intent];
          var component = app.additionalInformation;
          if (applications[intent] || builtIn[component] ||
            (fromPack[component] !== undefined && fromPack[component] !== app.url)) {
            return;
          }
          applications[intent] = app;
          fromPack[component] = app.url;
        });
      } catch (e) {
        // no packs.json, or not JSON: the built-in applications are the whole list
      }
    })();

    // Land on the home intent rather than on no intent at all.
    //
    // Measured, not guessed (backlog E.5): opening this page with an empty
    // hash throws one uncaught TypeError inside
    // `sap/ushell/library-preload.js` — "Cannot read properties of undefined
    // (reading 'appSpecificRoute')" — while `#Shell-home` throws none and
    // renders the same 96 tiles. The shell resolves an empty hash down a path
    // that does not survive; the same throw appears for an intent that does
    // not exist, which is the shape of the underlying fault and is theirs.
    //
    // Setting it before the bootstrap script runs costs nothing and takes the
    // page off that path. It is not a workaround for our own defect — there
    // is nothing of ours between the page loading and this throw — it is
    // choosing the entry that works out of two the shell offers.
    if (window.location.hash === "") {
      window.location.hash = "#Shell-home";
    }
  </script>
  <script src="https://ui5.sap.com/1.120.50/test-resources/sap/ushell/bootstrap/sandbox.js"
    id="sap-ushell-bootstrap"></script>
  <script>
    // preview deployment: the OData service is answered by a service worker,
    // so it has to control this page before UI5 asks for $metadata. When it
    // cannot, say so instead of booting into a blank list report.
    (async () => {
      const explain = (title, detail) => {
        document.body.innerHTML = "";
        const main = document.createElement("main");
        main.style.cssText = "max-width:40rem;margin:3rem auto;padding:0 1rem;font:16px/1.5 system-ui,sans-serif";
        const h = document.createElement("h1");
        h.style.fontSize = "1.3rem";
        h.textContent = title;
        const p = document.createElement("pre");
        p.style.whiteSpace = "pre-wrap";
        p.textContent = detail;
        const a = document.createElement("p");
        a.innerHTML = 'The gateway runs in a service worker. <a href="../">Install it again</a>, try another browser, or check that service workers and site data are allowed for this site.';
        main.append(h, p, a);
        document.body.append(main);
      };
      if (!("serviceWorker" in navigator)) {
        explain("This browser cannot run the preview", "navigator.serviceWorker is not available (private window, or service workers turned off).");
        return;
      }
      const expected = new URL("../sw.js", location.href).href;
      if (navigator.serviceWorker.controller?.scriptURL !== expected) {
        try {
          await navigator.serviceWorker.register("../sw.js", {scope: "../"});
          // A controller from a broader scope is not our backend. Wait for
          // this deployment's own worker, not just any non-null controller.
          for (let waited = 0; navigator.serviceWorker.controller?.scriptURL !== expected && waited < 60000; waited += 100) {
            await new Promise((tick) => setTimeout(tick, 100));
          }
          if (navigator.serviceWorker.controller?.scriptURL !== expected) {
            // a navigation after the registration is controlled for sure; once
            const key = "stg-preview-reload";
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, "1");
              location.reload();
              return;
            }
            sessionStorage.removeItem(key);
            throw new Error("the expected service worker does not control this page: " + expected);
          }
        } catch (error) {
          explain("The preview could not start", String(error && error.stack || error));
          return;
        }
      }
      // one round trip before UI5: the worker must be the one answering
      try {
        const probe = await fetch("../sap/opu/odata/sap/ZSTG_DEMO_SRV/", {headers: {accept: "application/json"}});
        if (!probe.ok) {
          explain("The gateway did not answer", "GET ../sap/opu/odata/sap/ZSTG_DEMO_SRV/ returned " + probe.status + "\n\n" + (await probe.text()).slice(0, 2000));
          return;
        }
      } catch (error) {
        explain("The gateway did not answer", String(error));
        return;
      }
      const boot = document.createElement("script");
      const attributes = {"id":"sap-ui-bootstrap","src":"https://ui5.sap.com/1.120.50/resources/sap-ui-core.js","data-sap-ui-theme":"sap_horizon","data-sap-ui-libs":"sap.m,sap.ushell,sap.ui.generic.app,sap.suite.ui.generic.template","data-sap-ui-compatVersion":"edge","data-sap-ui-async":"true","data-sap-ui-frameOptions":"allow","data-sap-ui-xx-componentPreload":"off","data-sap-ui-flexibilityServices":"","data-sap-ui-resourceroots":"{\"stg\": \"./\", \"stg.travel\": \"./\", \"stg.booking\": \"./booking\", \"stg.analytics\": \"./analytics\", \"stg.segw\": \"./segw\", \"stg.status\": \"./status\"}","data-sap-ui-oninit":"module:stg/launchpad"};
      for (const name of Object.keys(attributes)) {
        boot.setAttribute(name, attributes[name]);
      }
      document.head.appendChild(boot);
    })();
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
